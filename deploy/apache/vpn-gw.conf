# /etc/apache2/sites-available/vpn-gw.conf
# Modules: mpm_event proxy proxy_fcgi setenvif rewrite headers ssl http2 alias reqtimeout
# Do NOT install libapache2-mod-php and do NOT enable "conf php8.4-fpm".
# Replace: vpn-gw.company.ua, /k7f3x (must equal APP_BASE_PATH in .env), certificate paths.

<VirtualHost *:80>
    ServerName vpn-gw.company.ua
    DocumentRoot /var/www/html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://vpn-gw.company.ua%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName vpn-gw.company.ua
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/ssl/vpn-gw/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/vpn-gw/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off
    SSLSessionTickets     off

    DocumentRoot /srv/vpn-gw/public
    LimitRequestBody 16384
    # Admin panel -> «Оновлення»: release archive upload (the route itself is internal-network only)
    <Location "/k7f3x/admin/update">
        LimitRequestBody 54525952
    </Location>

    <Directory />
        Options None
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /srv/vpn-gw/public>
        Options None
        AllowOverride None
        Require all granted
        # Only the front controller is executed; any other .php is denied
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
        <Files "index.php">
            Require all granted
            SetHandler "proxy:unix:/run/php/php8.4-fpm-vpngw.sock|fcgi://vpngw"
        </Files>
    </Directory>

    # Client-supplied X-Forwarded-For is not trusted: drop it before processing.
    # If a load balancer sits in front, use mod_remoteip instead:
    #   RemoteIPHeader X-Forwarded-For
    #   RemoteIPTrustedProxy 10.0.10.5
    RequestHeader unset X-Forwarded-For early

    Alias /k7f3x/assets/ /srv/vpn-gw/public/assets/

    RewriteEngine On
    # 1) portal static files as-is (via Alias)
    RewriteRule ^/k7f3x/assets/ - [L]
    # 2) anything outside the portal path (incl. / and /index.php) -> 404
    RewriteCond %{REQUEST_URI} !^/k7f3x(/|$)
    RewriteRule ^ - [R=404,L]
    # 3) /k7f3x -> /k7f3x/
    RewriteRule ^/k7f3x$ /k7f3x/ [R=301,L]
    # 4) every other portal path -> front controller (REQUEST_URI is preserved for Slim)
    RewriteRule ^/k7f3x/ /index.php [L]

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Cache-Control "no-store"
    Header always unset X-Powered-By

    ErrorDocument 403 "Not Found"
    ErrorDocument 404 "Not Found"

    ErrorLog  ${APACHE_LOG_DIR}/vpn-gw-error.log
    CustomLog ${APACHE_LOG_DIR}/vpn-gw-access.log combined
</VirtualHost>

; /etc/php/8.4/fpm/pool.d/vpngw.conf
[vpngw]
user = vpngw
group = vpngw
listen = /run/php/php8.4-fpm-vpngw.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
request_terminate_timeout = 120s

php_admin_value[open_basedir] = /srv/vpn-gw:/var/lib/vpn-gw:/var/lib/vpn-gw-agent:/var/backups/vpn-gw:/var/log/vpn-gw:/etc/ssl:/tmp
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/lib/vpn-gw/logs/php-error.log
php_admin_flag[expose_php] = off
php_admin_value[session.save_path] = /var/lib/vpn-gw/sessions
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_value[date.timezone] = Europe/Kyiv
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[allow_url_include] = off
; Admin panel -> «Оновлення»: release archive upload (Apache allows large bodies only on that URL)
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 52M
php_admin_value[max_file_uploads] = 2
